<svg viewBox="0 0 600 548" fill="none" xmlns="http://www.w3.org/2000/svg" class="esvigy-animated" data-animated="true" data-author="Flowbite" data-source="https://flowbite.com">
  <style>
    @keyframes esvigy-folder-shuffle-1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-4px, -14px); }
    }
    @keyframes esvigy-folder-shuffle-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-3px, -11px); }
    }
    @keyframes esvigy-folder-shuffle-3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-2px, -8px); }
    }
    @keyframes esvigy-wing-sway-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2.5deg); }
    }
    @keyframes esvigy-wing-sway-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes esvigy-tray-breath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    svg.esvigy-animated .esvigy-folder-back,
    svg[data-animated="true"] .esvigy-folder-back {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: esvigy-folder-shuffle-1 3.4s ease-in-out infinite 0s;
    }

    svg.esvigy-animated .esvigy-folder-mid,
    svg[data-animated="true"] .esvigy-folder-mid {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: esvigy-folder-shuffle-2 3.4s ease-in-out infinite 0.5s;
    }

    svg.esvigy-animated .esvigy-folder-front,
    svg[data-animated="true"] .esvigy-folder-front {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: esvigy-folder-shuffle-3 3.4s ease-in-out infinite 1s;
    }

    svg.esvigy-animated .esvigy-wings-left,
    svg[data-animated="true"] .esvigy-wings-left {
      transform-box: fill-box;
      transform-origin: bottom right;
      animation: esvigy-wing-sway-left 4.5s ease-in-out infinite;
    }

    svg.esvigy-animated .esvigy-wings-right,
    svg[data-animated="true"] .esvigy-wings-right {
      transform-box: fill-box;
      transform-origin: bottom left;
      animation: esvigy-wing-sway-right 4.5s ease-in-out infinite 0.6s;
    }

    svg.esvigy-animated .esvigy-tray-front,
    svg[data-animated="true"] .esvigy-tray-front {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: esvigy-tray-breath 4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      svg.esvigy-animated .esvigy-folder-back,
      svg.esvigy-animated .esvigy-folder-mid,
      svg.esvigy-animated .esvigy-folder-front,
      svg.esvigy-animated .esvigy-wings-left,
      svg.esvigy-animated .esvigy-wings-right,
      svg.esvigy-animated .esvigy-tray-front,
      svg[data-animated="true"] .esvigy-folder-back,
      svg[data-animated="true"] .esvigy-folder-mid,
      svg[data-animated="true"] .esvigy-folder-front,
      svg[data-animated="true"] .esvigy-wings-left,
      svg[data-animated="true"] .esvigy-wings-right,
      svg[data-animated="true"] .esvigy-tray-front {
        animation: none !important;
      }
    }
  </style>

