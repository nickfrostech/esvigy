# @format

name: Publish @esvigy/react to npm

on:
   release:
      types: [published]
   workflow_dispatch:

permissions:
   contents: read
   id-token: write # Required for npm provenance & OIDC Trusted Publishing

jobs:
   publish:
      name: Build, Test & Publish to npm
      runs-on: ubuntu-latest

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Install pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 9

         - name: Setup Node.js (v22)
           uses: actions/setup-node@v4
           with:
              node-version: 22
              registry-url: "https://registry.npmjs.org"
              cache: "pnpm"

         - name: Install workspace dependencies
           run: pnpm install --frozen-lockfile

         - name: Build @esvigy/react
           run: pnpm --filter @esvigy/react build

         - name: Run Pre-Publish Tests
           run: pnpm --filter @esvigy/react test

         - name: Publish @esvigy/react to npm
           working-directory: packages/react
           run: npx npm@latest publish --access public --provenance
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
